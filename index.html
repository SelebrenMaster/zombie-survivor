<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Zombie Survivor Pro</title>
    <style>
        body { margin: 0; overflow: hidden; background: #121212; font-family: sans-serif; user-select: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; pointer-events: none; text-shadow: 2px 2px 4px black; z-index: 10; }
        #xp-bar-container { position: absolute; top: 0; left: 0; width: 100%; height: 10px; background: #333; z-index: 10; }
        #xp-bar { width: 0%; height: 100%; background: #44ff44; transition: width 0.2s; }
        #game-over, #level-up { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; display: none; background: rgba(0,0,0,0.9); padding: 30px; border-radius: 15px; border: 2px solid #44ff44; z-index: 100; }
        .upgrade-btn { display: block; width: 250px; margin: 10px auto; padding: 15px; font-size: 18px; cursor: pointer; background: #222; color: #44ff44; border: 1px solid #44ff44; border-radius: 5px; transition: 0.2s; }
        .upgrade-btn:hover { background: #44ff44; color: #000; }
        button.restart { padding: 10px 20px; font-size: 20px; cursor: pointer; background: #ff4444; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="xp-bar-container"><div id="xp-bar"></div></div>
    <div id="ui">Kills: <span id="score">0</span> | Level: <span id="level">1</span><br>Weapon: <span id="weapon">Pistol</span></div>
    <div id="game-over"><h1 style="color: red;">ВАС СОЖРАЛИ!</h1><p id="final-score"></p><button class="restart" onclick="location.reload()">Попробовать снова</button></div>
    <div id="level-up"><h1 style="color: #44ff44;">УРОВЕНЬ ПОВЫШЕН!</h1><p>Выберите улучшение:</p><div id="upgrade-list"></div></div>
    <canvas id="gameCanvas"></canvas>
    <script>
        (function() {
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            const scoreEl = document.getElementById("score");
            const levelEl = document.getElementById("level");
            const weaponEl = document.getElementById("weapon");
            const xpBar = document.getElementById("xp-bar");
            const gameOverEl = document.getElementById("game-over");
            const levelUpEl = document.getElementById("level-up");
            const upgradeListEl = document.getElementById("upgrade-list");

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener("resize", resize);
            resize();

            let score = 0, level = 1, xp = 0, xpNextLevel = 10, gameActive = true, isPaused = false;

            const WEAPONS = {
                pistol: { name: "Pistol", fireRate: 500, bulletSpeed: 7, damage: 1, spread: 0, count: 1, color: "yellow" },
                smg: { name: "SMG", fireRate: 150, bulletSpeed: 9, damage: 0.8, spread: 0.1, count: 1, color: "#ffcc00" },
                shotgun: { name: "Shotgun", fireRate: 800, bulletSpeed: 6, damage: 1.2, spread: 0.4, count: 5, color: "#ff6600" }
            };

            const player = { x: canvas.width / 2, y: canvas.height / 2, radius: 15, color: "#44ff44", speed: 3, weapon: WEAPONS.pistol, lastShot: 0 };
            const bullets = [], enemies = [], gems = [], weaponDrops = [];
            let enemySpawnTimer = 0;
            let targetX = player.x, targetY = player.y;

            window.addEventListener("pointermove", (e) => { targetX = e.clientX; targetY = e.clientY; });

            function spawnEnemy() {
                const rand = Math.random();
                let type = { name: "Normal", hp: 1, speed: 1.26, radius: 15, color: "#ff4444", xp: 1, behavior: "straight" };
                if (rand > 0.9) type = { name: "Tank", hp: 5, speed: 0.63, radius: 25, color: "#880000", xp: 5, behavior: "straight" };
                else if (rand > 0.7) type = { name: "Runner", hp: 0.5, speed: 2.63, radius: 10, color: "#ff8888", xp: 2, behavior: "zig-zag" };
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -type.radius : canvas.width + type.radius;
                    y = Math.random() * canvas.height;
                } else {
                    x = Math.random() * canvas.width;
                    y = Math.random() < 0.5 ? -type.radius : canvas.height + type.radius;
                }
                enemies.push({ ...type, x, y, currentHp: type.hp, angleOffset: Math.random() * Math.PI * 2 });
            }

            function spawnWeaponDrop() {
                const keys = Object.keys(WEAPONS);
                const weapon = WEAPONS[keys[Math.floor(Math.random() * keys.length)]];
                weaponDrops.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, radius: 12, weapon: weapon, color: "#00ffff", spawnTime: Date.now() });
            }

            function shoot() {
                const now = Date.now();
                if (now - player.lastShot < player.weapon.fireRate) return;
                player.lastShot = now;
                if (enemies.length === 0) return;
                let closest = enemies[0], minDist = Infinity;
                for (let i = 0; i < enemies.length; i++) {
                    const dist = Math.hypot(enemies[i].x - player.x, enemies[i].y - player.y);
                    if (dist < minDist) { minDist = dist; closest = enemies[i]; }
                }
                const baseAngle = Math.atan2(closest.y - player.y, closest.x - player.x);
                for (let i = 0; i < player.weapon.count; i++) {
                    const angle = baseAngle + (Math.random() - 0.5) * player.weapon.spread;
                    bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle) * player.weapon.bulletSpeed, vy: Math.sin(angle) * player.weapon.bulletSpeed, radius: 4, color: player.weapon.color, damage: player.weapon.damage });
                }
            }

            function handleLevelUp() {
                isPaused = true;
                levelUpEl.style.display = "block";
                upgradeListEl.innerHTML = "";
                const options = [
                    { text: "Скорость движения +10%", action: () => player.speed *= 1.1 },
                    { text: "Скорость атаки +15%", action: () => player.weapon.fireRate *= 0.85 },
                    { text: "Урон +20%", action: () => player.weapon.damage *= 1.2 },
                    { text: "Скорость пуль +1", action: () => player.weapon.bulletSpeed += 1 },
                ];
                const shuffled = options.sort(() => 0.5 - Math.random()).slice(0, 3);
                shuffled.forEach(opt => {
                    const btn = document.createElement("button");
                    btn.className = "upgrade-btn";
                    btn.innerText = opt.text;
                    btn.onclick = () => { opt.action(); isPaused = false; levelUpEl.style.display = "none"; };
                    upgradeListEl.appendChild(btn);
                });
            }

            function update() {
                if (!gameActive || isPaused) return;
                player.x += (targetX - player.x) * 0.1;
                player.y += (targetY - player.y) * 0.1;
                shoot();
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].x += bullets[i].vx; bullets[i].y += bullets[i].vy;
                    if (bullets[i].x < 0 || bullets[i].x > canvas.width || bullets[i].y < 0 || bullets[i].y > canvas.height) bullets.splice(i, 1);
                }
                enemySpawnTimer++;
                if (enemySpawnTimer > 60) { spawnEnemy(); enemySpawnTimer = 0; }
                if (Math.random() < 0.002) spawnWeaponDrop();
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    if (e.behavior === "zig-zag") angle += Math.sin(Date.now() * 0.005 + e.angleOffset) * 0.5;
                    e.x += Math.cos(angle) * e.speed; e.y += Math.sin(angle) * e.speed;
                    if (Math.hypot(e.x - player.x, e.y - player.y) < e.radius + player.radius) {
                        gameActive = false;
                        document.getElementById("final-score").innerText = "Убито зомби: " + score;
                        gameOverEl.style.display = "block";
                    }
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        const b = bullets[j];
                        if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
                            e.currentHp -= b.damage;
                            bullets.splice(j, 1);
                            if (e.currentHp <= 0) {
                                gems.push({ x: e.x, y: e.y, radius: 4, color: "#44ff44", xp: e.xp });
                                enemies.splice(i, 1);
                                score++;
                                scoreEl.innerText = score;
                                break;
                            }
                        }
                    }
                }
                for (let i = gems.length - 1; i >= 0; i--) {
                    const g = gems[i];
                    if (Math.hypot(g.x - player.x, g.y - player.y) < g.radius + player.radius) {
                        xp += g.xp; gems.splice(i, 1);
                        if (xp >= xpNextLevel) {
                            level++; xp -= xpNextLevel; xpNextLevel = Math.floor(xpNextLevel * 1.3);
                            levelEl.innerText = level; handleLevelUp();
                        }
                        xpBar.style.width = (xp / xpNextLevel * 100) + "%";
                    }
                }
                const now = Date.now();
                for (let i = weaponDrops.length - 1; i >= 0; i--) {
                    const w = weaponDrops[i];
                    if (now - w.spawnTime > 6000) weaponDrops.splice(i, 1);
                    else if (Math.hypot(w.x - player.x, w.y - player.y) < w.radius + player.radius) {
                        player.weapon = w.weapon; weaponEl.innerText = w.weapon.name; weaponDrops.splice(i, 1);
                    }
                }
            }

            function draw() {
                ctx.fillStyle = "#121212";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.strokeStyle = "#222";
                const gridSize = 60;
                const offsetX = -player.x % gridSize;
                const offsetY = -player.y % gridSize;
                for(let x = offsetX; x < canvas.width; x += gridSize) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
                for(let y = offsetY; y < canvas.height; y += gridSize) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
                ctx.fillStyle = player.color;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fill();
                bullets.forEach(b => { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill(); });
                enemies.forEach(e => {
                    ctx.fillStyle = e.color;
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
                    if (e.name === "Tank") {
                        ctx.fillStyle = "red"; ctx.fillRect(e.x - 15, e.y - 30, 30, 4);
                        ctx.fillStyle = "green"; ctx.fillRect(e.x - 15, e.y - 30, (e.currentHp/e.hp)*30, 4);
                    }
                });
                gems.forEach(g => { ctx.fillStyle = g.color; ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2); ctx.fill(); });
                const now = Date.now();
                weaponDrops.forEach(w => {
                    if (now - w.spawnTime > 3000 && Math.floor(now / 200) % 2 !== 0) return;
                    ctx.fillStyle = w.color;
                    ctx.beginPath(); ctx.arc(w.x, w.y, w.radius, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = "white"; ctx.font = "10px Arial";
                    ctx.fillText(w.weapon.name, w.x - 20, w.y - 20);
                });
                requestAnimationFrame(() => { update(); draw(); });
            }
            draw();
        })();
    </script>
</body>
</html>
